name: Supabase Keep Alive

on:
  schedule:
    # Runs at 11:00 AM IST = 05:30 UTC everyday 
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function and Notify
        run: |
          # 1. Run the curl and capture the response body
          # Using -s to stay silent and -w to handle potential errors
          RESPONSE=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/daily-checkin" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          
          echo "Response received: $RESPONSE"

          # 2. Extract values using jq
          # -r ensures raw output (removes the quotes from the strings)
          MSG=$(echo $RESPONSE | jq -r '.message')
          STATUS=$(echo $RESPONSE | jq -r '.dbStatus')

          # 3. Send formatted notification to ntfy
          # Format: Message: {message} , dbStatus : {dbStatus}
          curl -d "Message: $MSG , dbStatus : $STATUS" \
               ntfy.sh/vinayvp-app-alerts
