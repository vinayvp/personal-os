
<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image" href="/my_logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vinayak Pastey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="37e82014-725b-465e-8bd0-a9fba2fe9e04"></script>
    <script>
      function beforeSend(type, payload) {
        const excludedPages = ['/app'];
    
        if (excludedPages.includes(payload.url)) {
          return false; // This cancels the tracking request
        }
        return payload; // This allows tracking for all other pages
      }
    </script>
    <style>
      #nl-badge-frame,
      iframe[title*="Netlify"],
      iframe[src*="netlify.com"],
      iframe[id*="nl-"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        clip: rect(0, 0, 0, 0) !important;
      }
    </style>
    <script>
      (function () {
        function removeNetlifyBadge() {
          const els = document.querySelectorAll('#nl-badge-frame, iframe[title*="Netlify"], iframe[id*="nl-"]');
          els.forEach(function (el) { el.remove(); });
        }
        removeNetlifyBadge();
        if (typeof MutationObserver !== 'undefined') {
          const obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
